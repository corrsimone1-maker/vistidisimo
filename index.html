  <script>
    // Se l'app non parte entro qualche secondo (di solito file vecchi rimasti in cache dopo un
    // aggiornamento), mostra un pulsante che svuota la cache dell'app e ricarica. Token e dati restano.
    (function () {
      var err = '';
      window.addEventListener('error', function (e) { err = (e && (e.message || (e.error && e.error.message))) || err; }, true);
      setTimeout(function () {
        if (window.__vdsBooted) return;
        var v = document.getElementById('view');
        if (!v) return;
        v.innerHTML = '<div class="rescue"><h1>L’app non è partita</h1><p>Di solito succede quando il telefono tiene in cache i file della versione precedente. Tocca il pulsante: svuoto la cache dell’app e la riapro. Token e dati non si toccano.</p><button id="rescue-btn" class="btn primary wide">Ripara e riapri</button><p class="rescue-err"></p></div>';
        v.querySelector('.rescue-err').textContent = err;
        document.getElementById('rescue-btn').onclick = function () {
          var go = function () { location.replace(location.pathname + '?r=' + Date.now() + (location.hash || '')); };
          var jobs = [];
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
          if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
          Promise.all(jobs).then(go, go);
        };
      }, 7000);
    })();
  </script>
